description: >-
  FBN does not publish a public or partner developer API, so there are no
  documented API rate limits, quotas, or throttling policies. The FBN Direct
  marketplace, analytics, crop marketing, finance tools, and the Norm AI advisor
  are delivered through authenticated member-facing web and mobile apps. Any
  request shaping that exists is internal to those applications and is not
  documented for third-party developers.
notes: >-
