description: >-
  FinOps view of Farmers Business Network spend. FBN membership is free and there
  is no usage-metered developer API to govern. Member cost lands instead on
  transactional marketplace purchases through FBN Direct (inputs, seed,
  fertilizer, livestock products, farm supplies) and on fee- or interest-based
  FBN Finance products (loans, refinancing, crop insurance) plus crop marketing
  services. Cost management here is procurement- and finance-oriented rather than
  API-consumption-oriented.
notes: >-
  Not reconciled against FOCUS as a cloud/API billing source - FBN does not bill
  API usage. Meters below model farm-operation procurement and finance spend, not
  developer API consumption. Verify rates and terms with FBN per product.
sources:
- https://www.fbn.com/direct
