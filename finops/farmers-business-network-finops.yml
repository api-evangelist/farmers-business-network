meters:
- name: marketplace_purchases
  description: Spend on inputs and supplies purchased through the FBN Direct marketplace.
  unit: orders
  aggregation: sum
  dimensions:
  - account
  - product_category
- name: financing_balances
  description: Outstanding balances and fees on FBN Finance loans, refinancing, and operating lines.
  unit: contracts
  aggregation: sum
  dimensions:
  - account
  - product
- name: insurance_premiums
  description: Crop insurance premiums placed through FBN.
  unit: policies
  aggregation: sum
  dimensions:
  - account
  - product
- name: crop_marketing_fees
  description: Service fees associated with crop marketing transactions and contracts.
  unit: contracts
  aggregation: sum
  dimensions:
  - account
  - product
principles:
- name: Visibility
  description: Track marketplace order spend and finance balances within the FBN member dashboard.
- name: Allocation
  description: Map input purchases and financing to fields, crops, and operating cost centers.
- name: Optimization
  description: Use FBN's transparent pricing and benchmarking to compare input costs and reduce cost of production.
- name: Accountability
  description: Review procurement and financing spend against the farm operating budget each season.
