name: Farmers Business Network
kind: company
description: Farmers Business Network (FBN) is a farmer-to-farmer ag-tech network
  serving 117,000+ member farms across the U.S. and Canada. Its membership platform
  pairs the FBN Direct inputs marketplace with seed and farm analytics, crop
  marketing, agricultural financing, and Norm, an AI agronomy advisor. FBN exposes
  these as member-facing web and mobile product surfaces; it does not publish a
  public or partner developer API.
